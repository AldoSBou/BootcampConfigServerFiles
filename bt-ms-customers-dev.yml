server:
  port: ${CUSTOMER.SERVER.PORT:8081}    
spring:
  data:
    mongodb:
      uri: ${MONGODB.URL.CONNECTION:mongodb://bootcamp:bootcamp@localhost:27017/bootcampbdcustomers?authSource=admin}
      
# Eureka Client Configuration
eureka:
  client:
    fetchRegistry: true
    registerWithEureka: true
    serviceUrl:
      defaultZone: ${EUREKA.SERVER.HOSTNAME:http://localhost:8761/eureka}
      
#Kafka Configuration
bootcamp:
  kafka:
    serverHost: 127.0.0.1
    serverPort: 9092
    topic:
      userCreated: user-created
    group-id: customer-group