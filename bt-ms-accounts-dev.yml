server:
  port: ${CUSTOMER.SERVER.PORT:8082}    
spring:
  data:
    mongodb:
      uri: mongodb://localhost:27017/bootcampbdaccounts
      
# Eureka Client Configuration
eureka:
  client:
    fetchRegistry: true
    registerWithEureka: true
    serviceUrl:
      defaultZone: http://localhost:8761/eureka
  instance:
    hostname: localhost
    prefer-ip-address: false