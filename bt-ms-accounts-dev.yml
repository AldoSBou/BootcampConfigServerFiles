server:
  port: ${CUSTOMER.SERVER.PORT:8082}    
spring:
  data:
    mongodb:
      uri: ${MONGODB.URL.CONNECTION:mongodb://bootcamp:bootcamp@localhost:27017/bootcampbdaccounts?authSource=admin}
      
# Eureka Client Configuration
eureka:
  client:
    fetchRegistry: true
    registerWithEureka: true
    serviceUrl:
      defaultZone: ${EUREKA.SERVER.HOSTNAME:http://localhost:8761/eureka}